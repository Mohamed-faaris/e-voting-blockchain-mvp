[project]
name = "depthai-stream-server"
version = "0.1.0"
description = "Standalone browser-based OAK-D stream viewer using Luxonis DepthAI Python"
requires-python = ">=3.10"
dependencies = [
  "depthai==2.32.0.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
]

[tool.uv]
package = false
