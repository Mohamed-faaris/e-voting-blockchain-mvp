<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DepthAI · Stream Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b1017;--panel:#111a25;--line:#263445;--muted:#8da0b6;--text:#e7edf5;--accent:#65d4bb;--bad:#fb927f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);background:#0e151e;position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;align-items:center;gap:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:11px}button{background:var(--accent);border:0;border-radius:8px;padding:9px 13px;font-weight:700;color:#06251e;cursor:pointer}button:disabled{opacity:.5;cursor:wait}main{max-width:1440px;margin:auto;padding:22px 24px}.notice{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:18px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;min-width:0}.card-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line)}.card-head strong{font-size:12px}.state{font-size:10px;color:var(--muted)}.screen{aspect-ratio:4/3;background:#070b10;display:grid;place-items:center}.screen img{width:100%;height:100%;object-fit:contain}.screen .empty{color:#66788d;font-size:12px}footer{display:flex;justify-content:space-between;padding:9px 13px;color:var(--muted);font-size:10px}#error{color:var(--bad)}.hidden{display:none}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}main{padding:14px}.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>DepthAI Stream Lab</h1><p>Standalone OAK-D Lite · direct DepthAI Python capture</p></div><div class="actions"><span class="pill" id="device">Checking device…</span><button id="reconnect">Reconnect</button></div></header>
<main><div class="notice">This sample runs independently of the voting application. It reads the OAK-D Lite RGB and stereo sensors through the Luxonis DepthAI SDK and exposes each stream as a browser preview.<div id="error" role="status" style="margin-top:6px"></div></div><section class="grid" id="streams"></section></main>
<script>
const names=[['rgb','RGB camera','Color sensor output'],['left','Left mono','Raw left stereo sensor'],['right','Right mono','Raw right stereo sensor'],['rectified_left','Rectified left','Stereo-rectified left image'],['rectified_right','Rectified right','Stereo-rectified right image'],['disparity','Disparity','Stereo disparity visualization'],['depth','Depth','RGB-aligned depth visualization']];
const grid=document.querySelector('#streams');for(const [name,label,desc] of names){const card=document.createElement('article');card.className='card';card.innerHTML='<div class="card-head"><strong>'+label+'</strong><span class="state" id="state-'+name+'">WAITING</span></div><div class="screen"><span class="empty" id="empty-'+name+'">Waiting for frames…</span><img class="hidden" id="img-'+name+'" alt="'+label+' stream"></div><footer><span>'+desc+'</span><span id="seq-'+name+'">—</span></footer>';grid.append(card)}
function setStream(name,ready,seq){const img=document.querySelector('#img-'+name),empty=document.querySelector('#empty-'+name);document.querySelector('#state-'+name).textContent=ready?'LIVE':'WAITING';document.querySelector('#seq-'+name).textContent=ready?'Frame '+seq:'No frames';img.classList.toggle('hidden',!ready);empty.classList.toggle('hidden',ready);if(ready)img.src='/streams/'+name+'.jpg?t='+Date.now()}
async function refreshStatus(){try{const r=await fetch('/api/status',{cache:'no-store'}),s=await r.json();document.querySelector('#device').textContent=s.connected?(s.device_id||'OAK connected')+' · '+s.fps+' fps':'OAK not streaming';document.querySelector('#error').textContent=s.error||(!s.connected?'Connect the OAK-D Lite and select Reconnect.':'');for(const stream of s.available_streams||[])setStream(stream.name,stream.ready,stream.sequence)}catch(e){document.querySelector('#error').textContent='Cannot reach the local stream server: '+e}}
document.querySelector('#reconnect').addEventListener('click',async()=>{const b=document.querySelector('#reconnect');b.disabled=true;b.textContent='Connecting…';try{await fetch('/api/reconnect',{method:'POST'})}catch(e){}await refreshStatus();b.disabled=false;b.textContent='Reconnect'});setInterval(refreshStatus,350);refreshStatus();
</script></body></html>
