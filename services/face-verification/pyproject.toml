[project]
name = "civic-ledger-face-verification"
version = "0.1.0"
description = "Local face enrollment, recognition, and optional OAK-D Lite stereo-depth checks for Civic Ledger"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "opencv-contrib-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "pydantic>=2.8,<3",
    "depthai==2.32.0.0",
    "depthai>=3.0,<4",
]

[tool.uv]
package = false
