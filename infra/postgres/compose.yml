services:
  postgres:
    image: postgres:16-alpine
    container_name: evoting-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evoting_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - evoting_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evoting_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  evoting_demo_pgdata:
