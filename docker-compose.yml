services:
  postgres:
    image: postgres:17-alpine
    container_name: evoting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evoting
      POSTGRES_USER: evoting
      POSTGRES_PASSWORD: evoting_dev_only
    ports:
      - "5432:5432"
    volumes:
      - evoting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoting -d evoting"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  evoting_postgres_data:
